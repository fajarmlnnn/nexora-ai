name: Backend CI

on:
  push:
    branches:
      - main
      - codex/supabase-first-hardening
      - feat/backend-ci-v1
      - fix/backend-api-routing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          for attempt in 1 2 3 4; do
            echo "Composer install attempt ${attempt}/4"
            if composer install --no-interaction --prefer-dist --no-progress --no-scripts; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Composer install failed after 4 attempts"
          exit 1

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction --format=plain

      - name: Prepare environment
        run: |
          printf '%s\n' \
            'APP_NAME=Nexora' \
            'APP_ENV=testing' \
            'APP_KEY=' \
            'APP_DEBUG=true' \
            'APP_URL=http://localhost' \
            'LOG_CHANNEL=stderr' \
            'DB_CONNECTION=sqlite' \
            'DB_DATABASE=database/database.sqlite' \
            'CACHE_STORE=array' \
            'SESSION_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=array' \
            > .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run Composer scripts
        run: composer run-script post-autoload-dump --no-interaction

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Verify API route registration
        run: php artisan route:list --path=api/v1/health --json
