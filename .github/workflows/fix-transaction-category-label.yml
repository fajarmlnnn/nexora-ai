name: One-time transaction compile fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add missing category label helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/frontend/lib/features/transaction/presentation/transaction_page.dart')
          text = path.read_text()
          helper = """\n\nString _categoryLabel(TransactionCategory category) => switch (category) {\n      TransactionCategory.food => 'Makanan',\n      TransactionCategory.transport => 'Transportasi',\n      TransactionCategory.shopping => 'Belanja',\n      TransactionCategory.salary => 'Gaji',\n      TransactionCategory.investment => 'Investasi',\n      TransactionCategory.bills => 'Tagihan',\n      TransactionCategory.entertainment => 'Hiburan',\n      TransactionCategory.health => 'Kesehatan',\n      TransactionCategory.education => 'Pendidikan',\n      TransactionCategory.other => 'Lainnya',\n    };\n"""
          if 'String _categoryLabel(' not in text:
              text = text.rstrip() + helper
              path.write_text(text)
              print('Added _categoryLabel helper.')
          else:
              print('_categoryLabel already exists; no source change needed.')
          PY

      - name: Commit source fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/lib/features/transaction/presentation/transaction_page.dart .github/workflows/fix-transaction-category-label.yml
          git rm .github/workflows/fix-transaction-category-label.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix(frontend): restore transaction category label helper"
          git push
