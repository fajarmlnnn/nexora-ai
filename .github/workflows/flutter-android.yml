name: Android CI

on:
  push:
    branches:
      - main
      - feat/financial-engine-v1
      - redesign/nexora-visual-overhaul

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    env:
      NEXORA_SUPABASE_URL: ${{ secrets.NEXORA_SUPABASE_URL }}
      NEXORA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXORA_SUPABASE_PUBLISHABLE_KEY }}
      NEXORA_API_BASE_URL: ${{ secrets.NEXORA_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: |
          set -euo pipefail
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found. Skipping tests."
          fi

      - name: Run authenticated Supabase E2E tests when explicitly configured
        env:
          NEXORA_E2E_EMAIL: ${{ secrets.NEXORA_E2E_EMAIL }}
          NEXORA_E2E_PASSWORD: ${{ secrets.NEXORA_E2E_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$NEXORA_SUPABASE_URL" ] || \
             [ -z "$NEXORA_SUPABASE_PUBLISHABLE_KEY" ] || \
             [ -z "$NEXORA_E2E_EMAIL" ] || \
             [ -z "$NEXORA_E2E_PASSWORD" ]; then
            echo "::notice::Supabase E2E credentials are not configured; live integration tests remain UNVERIFIED."
            exit 0
          fi

          mapfile -t e2e_tests < <(find test/integration -maxdepth 1 -type f -name 'supabase_*_e2e_test.dart' -print 2>/dev/null | sort)

          if [ "${#e2e_tests[@]}" -eq 0 ]; then
            echo "::notice::No Supabase E2E test files are present; live financial/security invariants remain UNVERIFIED."
            exit 0
          fi

          for test_file in "${e2e_tests[@]}"; do
            echo "Running isolated Supabase E2E test: ${test_file}"
            flutter test "$test_file" \
              --dart-define=NEXORA_SUPABASE_URL="$NEXORA_SUPABASE_URL" \
              --dart-define=NEXORA_SUPABASE_PUBLISHABLE_KEY="$NEXORA_SUPABASE_PUBLISHABLE_KEY" \
              --dart-define=NEXORA_E2E_EMAIL="$NEXORA_E2E_EMAIL" \
              --dart-define=NEXORA_E2E_PASSWORD="$NEXORA_E2E_PASSWORD"
          done

      - name: Build Release APK
        run: |
          set -euo pipefail
          build_args=(--release)

          if [ -n "$NEXORA_SUPABASE_URL" ]; then
            build_args+=(--dart-define=NEXORA_SUPABASE_URL="$NEXORA_SUPABASE_URL")
          fi
          if [ -n "$NEXORA_SUPABASE_PUBLISHABLE_KEY" ]; then
            build_args+=(--dart-define=NEXORA_SUPABASE_PUBLISHABLE_KEY="$NEXORA_SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ -n "$NEXORA_API_BASE_URL" ]; then
            build_args+=(--dart-define=NEXORA_API_BASE_URL="$NEXORA_API_BASE_URL")
          fi

          flutter build apk "${build_args[@]}"

      - name: Verify APK output
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          echo "APK SHA256:"
          sha256sum "$apk"
          echo "APK size:"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nexora-ai-release
          path: apps/frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
