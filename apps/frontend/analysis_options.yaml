# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs. The analyzer can also be invoked from the command line by running
# `flutter analyze`.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # These are stylistic preferences that should not block the CI analyzer.
    unnecessary_underscores: false
    use_full_hex_values_for_flutter_colors: false
