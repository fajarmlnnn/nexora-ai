<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
<defs>
  <linearGradient id="body" x1="120" y1="90" x2="390" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#DCD9F2"/><stop offset="1" stop-color="#A7A4C8"/></linearGradient>
  <linearGradient id="purple" x1="130" y1="120" x2="390" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#A98BFF"/><stop offset=".5" stop-color="#7C3FFF"/><stop offset="1" stop-color="#4B19D8"/></linearGradient>
  <linearGradient id="screen" x1="155" y1="125" x2="355" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#15101F"/><stop offset="1" stop-color="#020207"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<!-- soft purple aura -->
<ellipse cx="256" cy="448" rx="150" ry="25" fill="#7C3FFF" opacity=".22" filter="url(#soft)"/>
<ellipse cx="256" cy="440" rx="116" ry="12" stroke="#9B6BFF" stroke-width="5" opacity=".9" filter="url(#glow)"/>
<!-- left arm -->
<path d="M137 300C104 318 87 343 78 371" stroke="#B9B5D4" stroke-width="28" stroke-linecap="round"/>
<circle cx="76" cy="375" r="20" fill="url(#body)"/>
<path d="M66 367l-12-13M70 360l-3-18M80 360l8-16" stroke="#8C88A9" stroke-width="8" stroke-linecap="round"/>
<!-- right arm waving -->
<path d="M375 285C404 264 418 232 420 205" stroke="#B9B5D4" stroke-width="28" stroke-linecap="round"/>
<circle cx="420" cy="198" r="21" fill="url(#body)"/>
<path d="M410 189l-12-17M417 183l-3-20M426 185l8-19M435 191l14-13" stroke="#8C88A9" stroke-width="8" stroke-linecap="round"/>
<!-- legs -->
<path d="M190 375v48" stroke="#AAA6C6" stroke-width="34" stroke-linecap="round"/>
<path d="M322 375v48" stroke="#AAA6C6" stroke-width="34" stroke-linecap="round"/>
<ellipse cx="187" cy="428" rx="37" ry="18" fill="url(#body)"/>
<ellipse cx="325" cy="428" rx="37" ry="18" fill="url(#body)"/>
<!-- torso -->
<rect x="132" y="258" width="248" height="145" rx="70" fill="url(#body)" stroke="#9E9AB9" stroke-width="4"/>
<circle cx="256" cy="326" r="39" fill="#22134A" stroke="#9C6DFF" stroke-width="5"/>
<text x="256" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#D9C7FF">N</text>
<!-- neck -->
<rect x="220" y="238" width="72" height="42" rx="18" fill="#77738F"/>
<!-- head -->
<rect x="92" y="58" width="328" height="226" rx="92" fill="url(#body)" stroke="#B4B0CE" stroke-width="5"/>
<!-- ears -->
<rect x="73" y="130" width="34" height="82" rx="17" fill="#8D89A8"/>
<rect x="405" y="130" width="34" height="82" rx="17" fill="#8D89A8"/>
<circle cx="90" cy="171" r="10" fill="#A06BFF"/>
<circle cx="422" cy="171" r="10" fill="#A06BFF"/>
<!-- face -->
<rect x="130" y="96" width="252" height="160" rx="60" fill="url(#screen)" stroke="#5B5476" stroke-width="4"/>
<!-- eyes -->
<ellipse cx="207" cy="167" rx="19" ry="30" fill="#B88CFF" filter="url(#glow)"/>
<ellipse cx="305" cy="167" rx="19" ry="30" fill="#B88CFF" filter="url(#glow)"/>
<!-- smile -->
<path d="M228 202Q256 225 284 202" stroke="#C69AFF" stroke-width="8" stroke-linecap="round"/>
<!-- face highlight -->
<path d="M160 119Q188 101 213 101" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".55"/>
<!-- chest glow -->
<circle cx="256" cy="326" r="55" stroke="#8B52FF" stroke-width="3" opacity=".28" filter="url(#glow)"/>
<!-- floating sparkles -->
<g fill="#B88CFF" filter="url(#glow)"><path d="M55 90l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/><path d="M451 96l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/></g>
</svg>