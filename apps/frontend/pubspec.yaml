name: frontend
description: Nexora — asisten keuangan personal
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.9.0
  supabase_flutter: ^2.9.1
  supabase: ^2.16.0
  flutter_svg: ^2.2.0
  fl_chart: ^1.1.1
  lucide_icons_flutter: ^3.0.6
  shared_preferences: ^2.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/logo/
    - assets/svg/
    - assets/mascot/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/Plus Jakarta Sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Plus Jakarta Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus Jakarta Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus Jakarta Sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Plus Jakarta Sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
